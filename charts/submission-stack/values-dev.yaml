fullnameOverride: "dare-control-submission"

global:
  # this makes the chart autogenerate all secrets
  dev: true
  argoProject: dare-control-submission
  namespace: dare-control-submission
  oidc:
    authority: "http://keycloak.localtest.me/realms/Dare-Control"
  ingress:
    enabled: false
  gatewayIngress:
    enabled: false
    hostnames: [ ]
    route:
      annotations: {}
      portname: httproute
      port: 8080
    gateway:
      # Setting this to false will bypass creation of gateway. Only do this if you are using a bespoke gateway.
      create: true
      name: DARE-submission-stack-gateway
      namespace: ""
      className: "traefik"
      #CA Issuer goes under gateway.annotations, if using.
      annotations:
        - cert-manager.io/cluster-issuer: "ca-issuer"
      # Traefik only listens on specific ports: HTTP 8000 and HTTPS 8843.
      # Note, if using Minio S3 API is served over HTTPS only.
      listeners:
        - name: HTTPS
          protocol: HTTPS
          port: 8843
          hostname: ""
          tls:
            enabled: true
            certificateRefs:
              - kind: Secret
                name: "ca-issuer-submission-stack-gateway-dev"
  storage:
    defaultClass: "standard"
    rwxClass: "standard"
    dbSize: "5Gi"
  monitoring:
    prometheusEndpoint: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
    prometheusNamespace: "monitoring"


seq:
  storageSize: "1Gi"

rabbitmq:
  storageSize: "1Gi"

submission:
  storageSize: "1Gi"
  chartVersion: "0.0.0-pr.1005"
  postgres:
    replicas: 1
    database: "DARE-Control"
    host: "submission-postgres"

  api:
    image:
      repository: harbor.ukserp.ac.uk/dare-trefx/control-main-api
      pullPolicy: IfNotPresent
      tag: "pr-1017"

    serviceType: ClusterIP

  ui:
    image:
      repository: harbor.ukserp.ac.uk/dare-trefx/control-main-ui
      pullPolicy: IfNotPresent
      tag: "pr-1017"

    serviceType: ClusterIP



  minioBucketName: "testbucket"

  queryImage:
    sql: "ukserp/runsql:1.0.0"
    graphql: "harbor.ukserp.ac.uk/dare-trefx/control-tre-hasura:1.33.1"


keycloak:
  enabled: true
  postgres:
    replicas: 1
    database: "keycloak"
    size: "2Gi"

minio:
  enabled: true
  repoURL: 'https://operator.min.io/'
  chart: tenant
  chartVersion: "7.1.1"

  ecParity: "EC:1"
  ecStripeSize: "2"

  tenantName: "submission-layer"
  firstPool:
    servers: 1
    volumesPerServer: 2
    size: 10Gi
    storageClassName: standard
    storageTierNodeLabel: "2"

  env: []

  extraPools: []
    # - servers: 2
    #   volumesPerServer: 1
    #   size: 1000Gi
    #   storageClassName: directpv-min-io-tier9
    #   storageTierNodeLabel: "woo"
    #   resources:
    #     requests:
    #       cpu: "8"
    #       memory: "8Gi"
    #     limits:
    #       cpu: "16"
    #       memory: "10Gi"


operators:
  minio:
    enabled: false

  postgres:
    enabled: false

  rabbitmq:
    enabled: false

rabbitmq-cluster-operator:
  clusterOperator:
    watchAllNamespaces: true
    image:
      repository: bitnamilegacy/rabbitmq-cluster-operator

  msgTopologyOperator:
    enabled: true
    watchAllNamespaces: true
    image:
      repository: bitnamilegacy/rmq-messaging-topology-operator

  rabbitmqImage:
    repository: bitnamilegacy/rabbitmq

  credentialUpdaterImage:
    repository: bitnamilegacy/rmq-default-credential-updater