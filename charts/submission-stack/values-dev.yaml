fullnameOverride: "dare-control-submission"

global:
  # this makes the chart autogenerate all secrets
  dev: true
  argoProject: dare-control-submission
  namespace: dare-control-submission
  oidc:
    authority: "http://keycloak.localtest.me/realms/Dare-Control"
  ingress:
    enabled: false
    host: "localtest.me"
  gateway:
    className: "traefik"
    adminClassName: "traefik"
  storage:
    defaultClass: "standard"
    rwxClass: "standard"
    dbSize: "5Gi"
  monitoring:
    prometheusEndpoint: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
    prometheusNamespace: "monitoring"


seq:
  storageSize: "1Gi"
  gatewayIngress:
    enabled: false
    hostAddr: "seq"
    tls:
      enabled: false
    gateway:
      create: true
      className: ""
      namespace: ""

rabbitmq:
  storageSize: "1Gi"

submission:
  storageSize: "1Gi"
  chartVersion: "0.0.0-pr.1005"
  postgres:
    replicas: 1
    database: "DARE-Control"
    host: "submission-postgres"

  api:
    image:
      repository: harbor.ukserp.ac.uk/dare-trefx/control-main-api
      pullPolicy: IfNotPresent
      tag: "pr-1017"

    serviceType: ClusterIP

  ui:
    image:
      repository: harbor.ukserp.ac.uk/dare-trefx/control-main-ui
      pullPolicy: IfNotPresent
      tag: "pr-1017"

    serviceType: ClusterIP



  minioBucketName: "testbucket"

  queryImage:
    sql: "ukserp/runsql:1.0.0"
    graphql: "harbor.ukserp.ac.uk/dare-trefx/control-tre-hasura:1.33.1"

  gatewayIngress:
    enabled: false
    hostAddr: "submission"
    tls:
      enabled: false
    gateway:
      create: true
      className: ""


keycloak:
  enabled: true
  postgres:
    replicas: 1
    database: "keycloak"
    size: "2Gi"
  gatewayIngress:
    enabled: false
    hostAddr: "keycloak"
    tls:
      enabled: false
    gateway:
      create: true
      className: ""
      namespace: ""

minio:
  enabled: true
  repoURL: 'https://operator.min.io/'
  chart: tenant
  chartVersion: "7.1.1"

  ecParity: "EC:1"
  ecStripeSize: "2"

  tenantName: "submission-layer"
  firstPool:
    servers: 1
    volumesPerServer: 2
    size: 10Gi
    storageClassName: standard
    storageTierNodeLabel: "2"

  env: []

  extraPools: []
    # - servers: 2
    #   volumesPerServer: 1
    #   size: 1000Gi
    #   storageClassName: directpv-min-io-tier9
    #   storageTierNodeLabel: "woo"
    #   resources:
    #     requests:
    #       cpu: "8"
    #       memory: "8Gi"
    #     limits:
    #       cpu: "16"
    #       memory: "10Gi"

  gatewayIngress:
    api:
      enabled: false
      hostAddr: "minio-api"
      tls:
        enabled: false
      gateway:
        create: true
        className: ""
        namespace: ""
    console:
      enabled: false
      hostAddr: "minio"
      tls:
        enabled: false
      gateway:
        create: true
        className: ""
        namespace: ""


operators:
  minio:
    enabled: false

  postgres:
    enabled: false

  rabbitmq:
    enabled: false

rabbitmq-cluster-operator:
  clusterOperator:
    watchAllNamespaces: true
    image:
      repository: bitnamilegacy/rabbitmq-cluster-operator

  msgTopologyOperator:
    enabled: true
    watchAllNamespaces: true
    image:
      repository: bitnamilegacy/rmq-messaging-topology-operator

  rabbitmqImage:
    repository: bitnamilegacy/rabbitmq

  credentialUpdaterImage:
    repository: bitnamilegacy/rmq-default-credential-updater