{{- if .Values.global.gatewayIngress.enabled }}
{{- $namespace := .Values.global.gatewayIngress.gateway.namespace | default .Release.Namespace }}
{{- $fullName := include "submission-stack.fullname" . -}}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{ - include "submission.labels" . | nindent 4 }}
  {{ - with .Values.global.gatewayIngress.route.annotations }}
  annotations:
    {{ - toYaml . | nindent 4 }}
  {{ - end }}
spec:
  parentRefs:
    - name: {{ .Values.global.gatewayIngress.gateway.name }}
      namespace: {{ $namespace }}
  hostnames:
    {{- range .Values.global.gatewayIngress.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.global.gatewayIngress.route.portName }}
          port: {{ .Values.global.gatewayIngress.route.port }}
{{ end }}