{{- if .Values.global.gatewayIngress.enabled }}
{{- $namespace := .Values.global.gatewayIngress.gateway.namespace | default .Release.Namespace }}
{{- $gatewayName := .Values.global.gatewayIngress.gateway.name }}
{{- range .Values.global.gatewayIngress.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "submission-stack.fullname" $ }}-{{ .name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "submission-stack.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{/*
  Once the admin Gateway (see gateway.yaml) exists, replace the parentRefs block below
   so routes tagged `gateway: admin` in values.yaml (keycloak,
  seq) attach to the admin Gateway instead of the public one:

  */}}
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $namespace }}
      sectionName: {{ .name }}
  hostnames:
    - {{ .hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        {{- if eq .name "app" }}
        - name: {{ include "submission-stack.fullname" $ }}-ui
          port: {{ .backendPort }}
        {{- else if eq .name "minio-api" }}
        - name: minio
          port: {{ .backendPort }}
        {{- else if eq .name "minio-console" }}
        - name: {{ $.Values.minio.tenantName }}-console
          port: {{ .backendPort }}
        {{- else if eq .name "keycloak" }}
        - name: keycloak
          port: {{ .backendPort }}
        {{- else if eq .name "seq" }}
        - name: {{ include "submission-stack.fullname" $ }}-seq
          port: {{ .backendPort }}
        {{- end }}
{{- end }}
{{- end }}
