fullnameOverride: "dare-control-submission"

global:
  # this makes the chart autogenerate all secrets
  dev: true
  argoProject: dare-control-submission
  namespace: dare-control-submission
  oidc:
    authority: "https://keycloak.mk.serp.ac.uk/realms/k8s-msreg"
  ingress:
    enabled: false
    host: "forms.msregister.pk.serp.ac.uk"
    className: "nginx-msreg"
    adminClassName: "nginx-hiru"
    certClusterIssuer: "ca-issuer"
  gatewayIngress:
    enabled: false
    routes:
      - name: app
        hostname: "submission.forms.msregister.pk.serp.ac.uk"
        port: 8843
        backendPort: 80
        tls:
          enabled: true
          certificateRefName: "ca-issuer-submission-stack-gateway"
        annotations: { }
      - name: minio-api
        hostname: "minio-api.forms.msregister.pk.serp.ac.uk"
        port: 8843
        backendPort: 9000
        tls:
          enabled: true
          certificateRefName: "ca-issuer-submission-stack-minio-api"
        annotations: {}
      - name: minio-console
        hostname: "minio.forms.msregister.pk.serp.ac.uk"
        port: 8843
        backendPort: 9090
        tls:
          enabled: true
          certificateRefName: "ca-issuer-submission-stack-minio-console"
        annotations: {}
      - name: keycloak
        hostname: "keycloak.forms.msregister.pk.serp.ac.uk"
        port: 8843
        backendPort: 8085
        tls:
          enabled: true
          certificateRefName: "ca-issuer-submission-stack-keycloak"
        annotations: {}
        # gateway: admin   # uncomment once adminGateway below is enabled, to move this route off the public Gateway
      - name: seq
        hostname: "seq.forms.msregister.pk.serp.ac.uk"
        port: 8843
        backendPort: 80
        tls:
          enabled: true
          certificateRefName: "ca-issuer-submission-stack-seq"
        annotations: {}
        # gateway: admin   # uncomment once adminGateway below is enabled, to move this route off the public Gateway
    gateway:
      # Setting this to false will bypass creation of gateway. Only do this if you are using a bespoke gateway.
      create: true
      name: DARE-submission-stack-gateway
      namespace: ""
      className: "traefik"
      #CA Issuer goes under gateway.annotations, if using.
      annotations:
        cert-manager.io/cluster-issuer: "ca-issuer"

    # There's no admin Traefik GatewayClass yet (this mirrors what
    # global.ingress.adminClassName used to give us for keycloak/seq under nginx-ingress -
    # see keycloak.yaml/seq.yaml, which still route through adminClassName).
    # Once one exists:
    #   1. Fill in className below (and namespace/annotations if it differs from the public one).
    #   2. Uncomment this block.
    #   3. Uncomment the `gateway: admin` lines on the keycloak/seq route entries above.
    #   4. Uncomment the matching block in templates/gateway.yaml.
    #   5. Update templates/httproutes.yaml's parentRefs to pick adminGateway vs gateway
    #      per-route based on the `gateway` field (see the comment there).
    # adminGateway:
    #   create: true
    #   name: DARE-submission-stack-admin-gateway
    #   namespace: ""
    #   className: ""
    #   annotations:
    #     cert-manager.io/cluster-issuer: "ca-issuer"

  storage:
    defaultClass: "default"
    rwxClass: "default"
    dbSize: "5Gi"
  monitoring:
    prometheusEndpoint: "http://prometheus-operator-kube-p-prometheus.hiru-mgmt-monitoring.svc:9090"
    prometheusNamespace: "hiru-mgmt-monitoring"

vault:
  role: hiru
  secretPath: kvv2/data/prod/hiru/darecontrol/submission

seq:
  storageSize: "1Gi"

rabbitmq:
  storageSize: "1Gi"

submission:
  storageSize: "1Gi"
  chartVersion: "1.0.0"
  postgres:
    replicas: 1
    database: "DARE-Control"
    host: "submission-postgres"

  api:
    image:
      repository: harbor.ukserp.ac.uk/dare-trefx/control-main-api
      pullPolicy: IfNotPresent
      tag: "2.12.0"

    serviceType: ClusterIP

  ui:
    image:
      repository: harbor.ukserp.ac.uk/dare-trefx/control-main-ui
      pullPolicy: IfNotPresent
      tag: "2.12.0"

    serviceType: ClusterIP



  minioBucketName: "testbucket"
  keycloakConfig:
    proxy:
      enabled: false
      url: "http://proxy:8080"
      bypassList: "minio,seq"

    api:
      protocol: "http"
      host: "keycloak"
      realm: "Dare-Control"
      secretName: "api-keycloak-secret"
      clientSecretKey: "secret"
      clientIdKey: "id" 
      redirectUrl: ""
      useRedirect: false
      tokenRefreshSeconds: "3600"
      trustKeycloakCert: false
      validAudiences: "Dare-Control-UI,Dare-Control-API,Dare-Control-Minio"
      validIssuer: ""
      validAudience: ""

    ui:
      protocol: "http"
      host: "keycloak"
      realm: "Dare-Control"
      secretName: "ui-keycloak-secret"
      clientSecretKey: "secret"
      clientIdKey: "id" 
      tokenExpiredAddress: "http://localhost:5001/Account/LoginAfterTokenExpired"
      redirectUrl: ""
      useRedirect: false
      tokenRefreshSeconds: "3600"
      trustKeycloakCert: false
      validIssuer: ""
      validAudience: ""

  queryImage:
    sql: "ukserp/runsql:1.0.0"
    graphql: "harbor.ukserp.ac.uk/dare-trefx/control-tre-hasura:2.12.0"


keycloak:
  enabled: true
  postgres:
    replicas: 1
    database: "keycloak"
    size: "2Gi"

minio:
  enabled: true
  repoURL: 'https://operator.min.io/'
  chart: tenant
  chartVersion: "7.1.1"

  ecParity: "EC:1"
  ecStripeSize: "2"

  tenantName: "submission-layer"
  firstPool:
    servers: 1
    volumesPerServer: 2
    size: 10Gi
    storageClassName: default
    storageTierNodeLabel: "2"

  env: []

  extraPools: []
    # - servers: 2
    #   volumesPerServer: 1
    #   size: 1000Gi
    #   storageClassName: directpv-min-io-tier9
    #   storageTierNodeLabel: "woo"
    #   resources:
    #     requests:
    #       cpu: "8"
    #       memory: "8Gi"
    #     limits:
    #       cpu: "16"
    #       memory: "10Gi"


operators:
  minio:
    enabled: false

  postgres:
    enabled: false

  rabbitmq:
    enabled: false

rabbitmq-cluster-operator:
  clusterOperator:
    watchAllNamespaces: true
    image:
      repository: bitnamilegacy/rabbitmq-cluster-operator

  msgTopologyOperator:
    enabled: true
    watchAllNamespaces: true
    image:
      repository: bitnamilegacy/rmq-messaging-topology-operator

  rabbitmqImage:
    repository: bitnamilegacy/rabbitmq

  credentialUpdaterImage:
    repository: bitnamilegacy/rmq-default-credential-updater