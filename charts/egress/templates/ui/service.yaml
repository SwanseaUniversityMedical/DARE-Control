{{- if .Values.ui.enabled -}}
apiVersion: v1
kind: Service
metadata:
  # Static: this is the name referenced by other charts as "egress-ui".
  name: egress-ui
  {{- with .Values.ui.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "egress.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "egress.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- end }}
