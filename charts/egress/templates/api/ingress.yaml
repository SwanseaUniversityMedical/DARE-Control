{{- if and .Values.global.ingress.enabled .Values.api.enabled .Values.api.ingress.enabled -}}
{{- $host := .Values.api.ingress.host | default (printf "egress-api.%s" .Values.global.ingress.host) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "egress.fullname" . }}-api
  labels:
    {{- include "egress.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.ingress.certClusterIssuer }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- if .Values.global.ingress.tls }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: egress-api-tls
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: egress-api
                port:
                  number: 80
{{- end }}
