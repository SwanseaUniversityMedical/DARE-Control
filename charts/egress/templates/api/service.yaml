{{- if .Values.api.enabled -}}
apiVersion: v1
kind: Service
metadata:
  # Static: ui's DataEgressAPISettings__Address is a template literal pointing here.
  name: egress-api
  labels:
    {{- include "egress.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "egress.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
