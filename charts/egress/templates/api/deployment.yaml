{{- if .Values.api.enabled -}}
{{- $authority := trimSuffix "/" .Values.global.oidc.authority }}
{{- $keycloakUrl := urlParse $authority }}
{{- $treAuthority := trimSuffix "/" .Values.tre.oidcAuthority }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "egress.fullname" . }}-api
  labels:
    {{- include "egress.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # The API seeds demo data on startup; not designed for more than one pod.
  replicas: 1
  selector:
    matchLabels:
      {{- include "egress.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "egress.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "egress.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.global.trustClusterCa.enabled }}
        - name: certs-overlay
          configMap:
            name: {{ .Values.global.trustClusterCa.configMapName }}
            defaultMode: 420
        {{- end }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Values.global.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.global.trustClusterCa.enabled }}
            - name: certs-overlay
              mountPath: {{ .Values.global.trustClusterCa.mountPath }}
              subPath: {{ .Values.global.trustClusterCa.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "{{ .Values.global.config.aspnetEnvironment }}"
            - name: Logging__LogLevel__Default
              value: "{{ .Values.global.config.logging.default }}"
            - name: Logging__LogLevel__Microsoft.AspNetCore
              value: "{{ .Values.global.config.logging.microsoftAspNetCore }}"
            - name: AllowedHosts
              value: "{{ .Values.global.config.allowedHosts }}"
            # Unguarded .ToLower() at startup with no try/catch in the API:
            # unset crashes the pod. Never gate behind an if.
            - name: DemoMode
              value: "{{ .Values.api.demoMode }}"
            - name: KeycloakDemoMode
              value: "{{ .Values.api.keycloakDemoMode }}"
            - name: SuppressAntiforgery
              value: "{{ .Values.api.suppressAntiforgery }}"
            - name: DemoModeDefaultP
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secretName }}
                  key: demoModeDefaultPassword
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secretName }}
                  key: connectionString
            - name: Serilog__SeqServerUrl
              value: "{{ .Values.global.config.seqUrl }}"
            - name: Serilog__MinimumLevel__Default
              value: "{{ .Values.global.config.serilog.default }}"
            - name: Serilog__MinimumLevel__Override__Microsoft
              value: "{{ .Values.global.config.serilog.overrideMicrosoft }}"
            - name: Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore.Model.Validation
              value: "{{ .Values.global.config.serilog.overrideEfCoreModelValidation }}"
            - name: Serilog__MinimumLevel__Override__System
              value: "{{ .Values.global.config.serilog.overrideSystem }}"
            - name: Serilog__MinimumLevel__Override__Hangfire
              value: "{{ .Values.global.config.serilog.overrideHangfire }}"
            - name: TreKeyCloakSettings__ClientId
              value: "{{ .Values.api.treOidc.clientId }}"
            - name: TreKeyCloakSettings__BaseUrl
              value: "{{ $treAuthority }}"
            - name: TreKeyCloakSettings__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secretName }}
                  key: treKeycloakClientSecret
            - name: TreKeyCloakSettings__Proxy
              value: "{{ .Values.api.treOidc.proxy }}"
            - name: TreKeyCloakSettings__ProxyAddresURL
              value: "{{ .Values.api.treOidc.proxyAddresUrl }}"
            # Bare realm URL: no .well-known suffix, no trailing slash. 
            - name: DataEgressKeyCloakSettings__Authority
              value: "{{ $authority }}"
            - name: DataEgressKeyCloakSettings__MetadataAddress
              value: "{{ $authority }}/.well-known/openid-configuration"
            - name: DataEgressKeyCloakSettings__RootUrl
              # Derived from global.oidc.authority
              value: "{{ $keycloakUrl.scheme }}://{{ $keycloakUrl.host }}"
            - name: DataEgressKeyCloakSettings__BaseUrl
              value: "{{ $authority }}"
            - name: DataEgressKeyCloakSettings__ClientId
              value: "{{ .Values.api.oidc.clientId }}"
            - name: DataEgressKeyCloakSettings__Realm
              # Derived from global.oidc.authority
              value: "{{ last (splitList "/" (trimSuffix "/" $keycloakUrl.path)) }}"
            - name: DataEgressKeyCloakSettings__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secretName }}
                  key: dataEgressKeycloakClientSecret
            # this needs to be set or the pod crashes
            - name: DataEgressKeyCloakSettings__ValidAudiences
              value: "{{ .Values.api.oidc.validAudiences }}"
            - name: DataEgressKeyCloakSettings__Proxy
              value: "{{ .Values.api.oidc.proxy }}"
            - name: DataEgressKeyCloakSettings__ProxyAddresURL
              value: "{{ .Values.api.oidc.proxyAddresUrl }}"
            - name: DataEgressKeyCloakSettings__BypassProxy
              value: "{{ .Values.api.oidc.bypassProxy }}"
            - name: MinioSettings__Url
              value: "{{ .Values.api.s3Url }}"
            - name: MinioSettings__AccessKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secretName }}
                  key: s3AccessKey
            - name: MinioSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secretName }}
                  key: s3SecretKey
            # Typo in c# appsettings, not a typo in the chart
            - name: MinioSettings__UesProxy
              value: "{{ .Values.api.s3Proxy.enabled }}"
            - name: MinioSettings__ProxyAddresURL
              value: "{{ .Values.api.s3Proxy.addressUrl }}"
            - name: MinioSettings__BypassProxy
              value: "{{ .Values.api.s3Proxy.bypassProxy }}"
            - name: TreAPISettings__Address
              value: "{{ .Values.api.treApiAddress }}"
            # Self-referential (own static Service); the CORS policy that
            # reads this is built but never applied (app.UseCors() is unnamed).
            - name: DataEgressAPISettings__Address
              value: "http://egress-api"
            - name: EncryptionSettings__Key
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secretName }}
                  key: encryptionKey
            - name: EncryptionSettings__Base
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secretName }}
                  key: encryptionBase
            - name: EmailSettings__Host
              value: "{{ .Values.api.email.host }}"
            - name: EmailSettings__Port
              value: "{{ .Values.api.email.port }}"
            - name: EmailSettings__EnableSSL
              value: "{{ .Values.api.email.enableSsl }}"
            - name: EmailSettings__FromAddress
              value: "{{ .Values.api.email.fromAddress }}"
            - name: EmailSettings__FromDisplayName
              value: "{{ .Values.api.email.fromDisplayName }}"
            - name: EmailSettings__EmailOverride
              value: "{{ .Values.api.email.override }}"
            - name: EmailSettings__Enabled
              value: "{{ .Values.api.email.enabled }}"
            - name: DataProtectionSettings__PersistKeys
              value: "{{ .Values.dataProtection.persistKeys }}"
            - name: DataProtectionSettings__KeysPath
              value: "{{ .Values.dataProtection.keysPath }}"
            {{- if .Values.global.monitoring.enabled }}
            - name: PUSHGATEWAY_URL
              value: "{{ .Values.global.monitoring.pushgatewayUrl }}"
            - name: PUSHGATEWAY_JOB
              value: "{{ .Release.Namespace }}-egress-api"
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
