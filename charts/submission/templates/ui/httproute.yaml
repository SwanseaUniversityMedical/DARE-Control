{{- if .Values.config.gatewayIngress.enabled }}
{{- $namespace := .Values.config.gatewayIngress.gateway.namespace | default .Release.Namespace }}
{{- $svcPort := .Values.ui.service.port -}}
{{- $fullName := include "submission.fullname" . -}}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "submission.labels" . | nindent 4 }}
  {{- with .Values.config.gatewayIngress.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.config.gatewayIngress.gateway.name }}
      namespace: {{ $namespace }}
  hostnames:
    {{- range .Values.config.gatewayIngress.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullName }}-ui
          port: {{ $svcPort }}
{{ end }}