name: PR Title Commitlint

on:
  pull_request:
    # Run on all PRs whenever the title could have changed
    types:
      - opened
      - reopened
      - edited
      - synchronize

# The shared pr-lint action posts its result as a PR comment and labels a failing PR. A token
# without these write scopes fails that step - "Resource not accessible by integration" - and
# turns the check red even when the title passed.
permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # This linting can be cancelled if there is a newer commit to lint
  cancel-in-progress: true

jobs:
  pr-title-commitlint:
    uses: SwanseaUniversityMedical/workflows/.github/workflows/pr-title-commitlint.yaml@v1.4.11-pr-title-commitlint
